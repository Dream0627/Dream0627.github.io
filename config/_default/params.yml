########################################
# 基础配置
########################################

# 主菜单导航
# 更多图标信息请参考 https://github.com/D-Sketon/hexo-theme-reimu/issues/30
menu:
  - name: home
    url: ""
    icon: # 默认使用太极图标，也可以填 fontawesome 或 icon_font 的十六进制编码，如 'f0c1'
  - name: archives
    url: "archives"
    icon:
  - name: about
    url: "about"
    icon:
  - name: friend
    url: "friend"
    icon:

# 友链
friends:
  shuffle: false  # 是否随机打乱友链顺序

mainSections: ["post"]
# 年，月，日及时间的格式化样式
# 使用 Go 的时间格式化写法
yearFormat: "2006"
monthFormat: "2006-01"
dateFormat: "2006-01-02"
timeFormat: "2006-01-02 15:04:05"

author: Dream
email: 2551487450@qq.com
description: "好困..."
# subtitle: "好困..."
subtitle:
  typing:
    enable: false
    strings:
      # - 句子 1
      # - 句子 2
      # - 句子 3
      # - 句子 4
    typeSpeed: 100              # 打字速度（毫秒/字符） 
    backSpeed: 50               # 删除速度（毫秒/字符）
    backDelay: 2000             # 打完一句话后，等待时间
    startDelay: 300             # 页面加载后，等待时间
    loop: true                  # 是否循环播放
    shuffle: true              # 是否随机输出句子
    showCursor: true            # 是否显示闪烁的字符
    cursorChar: "|"             # 字符
    smartBackspace: false       # 智能退格，只删除不同的部分
  text: "好困..."        # 当 typing.enable = false 时使用

banner: "images/2.jpg"
# 也可以直接写成一个 URL
# banner: "https://example.com"

# 如需使用 srcset 属性（按屏幕宽度加载不同图片），请启用此项
banner_srcset:
  enable: false
  srcset:
    - src: "images/banner-600w.webp"
      media: "(max-width: 479px)"
    - src: "images/banner-800w.webp"
      media: "(max-width: 799px)"
    - src: "images/banner.webp"
      media: "(min-width: 800px)" 

avatar: "avatar.webp"

# 控制文章封面的显示
# 未设置时默认显示 banner 图
# 优先级低于文章 Front-matter 中的 cover
cover: # https://example.com / false / rgb(255,117,117)

# 控制文章目录（TOC）的显示
# 优先级低于文章 Front-matter 中的 toc
toc: true

# Open Graph 社交分享信息
open_graph:
  enable: true
  options:
    #twitter_card: <twitter:card>
    #twitter_id: <twitter:creator>
    #twitter_site: <twitter:site>
    #twitter_image: <twitter:image>
    #google_plus: <g+:profile_link>
    #fb_admins: <fb:admin_id>
    #fb_app_id: <fb:app_id>

# 内容
excerpt_link: Read More

# 页脚版权信息
# 可在页脚版权处注入代码片段
# 请确保代码片段是 safeHTML
copyright:
# 需要帮助选择协议？请看：
# https://creativecommons.org/choose/
# https://choosealicense.com/
# copyright: |-
#   <div style="flex-direction:column;align-items: center;"><a rel="license" href="http://creativecommons.org/licenses/by/4.0/"><img alt="Creative Commons License" style="border-width:0" src="https://i.creativecommons.org/l/by/4.0/88x31.png" /></a>
#   All website licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a></div>

footer:
  since: 2020 # 2020 到当前年份
  powered: true
  count: true
  busuanzi: true
  icon:
    url: "../images/taichi.png" # 此路径相对于 css/main.css，需要用 ../ 回到 images 目录
    rotate: true
    mask: true # 是否将图片作为遮罩

# 侧边栏
# sidebar: right # 已废弃，请改用 sidebar.position
sidebar:
