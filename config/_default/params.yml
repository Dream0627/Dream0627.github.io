########################################
# 实验性功能
########################################

# 注入代码片段
# 请确保代码片段是 safeHTML
injector:
  head_begin: # 在 <head> 之后注入代码片段
  head_end: # 在 </head> 之前注入代码片段
  body_begin: # 在 <body> 之后注入代码片段
  body_end: # 在 </body> 之前注入代码片段
  sidebar_begin: # 在 <aside> 之后注入代码片段
  sidebar_end: # 在 </aside> 之前注入代码片段

# 实验性功能，可能存在较多 bug，请谨慎开启！
pjax:
  enable: false

# 实验性功能
# 参见 https://github.com/GoogleChromeLabs/quicklink
quicklink:
  enable: false
  # requestIdleCallback 的超时时间（毫秒）
  timeout: 3000
  # options.el 容器内的 URL 是否按高优先级处理
  # 为 true 时 quicklink 会在支持的情况下使用 fetch() API（而不是 link[rel=prefetch]）
  priority: true
  # 判断某个 URL 是否需要预取
  # 仅支持字符串
  ignores: []

# 实验性功能
service_worker:
  enable: false

# 实验性功能
live2d:
  enable: false
  position: left # left 或 right

# 实验性功能
live2d_widgets:
  enable: false
  position: left # left 或 right

# https://github.com/CodeByZach/pace
pace:
  enable: true

# 实验性功能
# 请先开启 pjax 才能使用此功能
player:
  disable_on_mobile: false
  position: before_sidebar # before_sidebar | after_sidebar | after_widget
  # 如果要启用 meting，必须先启用 aplayer
  aplayer:
    # https://github.com/DIYgod/APlayer
    enable: false
    options:
      audio: []
      fixed: true
      autoplay:
      loop:
      order:
      preload:
      volume:
      mutex:
      listFolded:
      lrcType:
  meting:
    # https://github.com/metowolf/MetingJS
    # 要使用 meting 请先启用 aplayer
    enable: false
    meting_api: # 自定义 API
    options:
      id: 2265921590
      server: netease
      type: playlist
      auto:

########################################
# pangu.js
########################################

pangu:
  # 更多信息：https://github.com/vinta/pangu.js 
  enable: false  # 启用 pangu.js 自动在中英文之间加空格

########################################
# 主题
########################################

# 实验性功能，可能存在较多 bug，请谨慎开启！
# 基于 Google Material You 设计规范的动态取色工具，可从任意图片提取主色并生成完整的明暗配色方案。
material_theme:
  # 更多信息：https://github.com/2061360308/material-theme
  # 注意：启用后所有封面会自动添加 "crossorigin" 属性以支持动态配色
  # 因此请确保自定义封面不会被浏览器的 CORS 策略拦截
  enable: true # 启用 material_theme，根据 banner 图生成动态配色方案

