  # qq:
  # tiktok:

widgets:
  - category
  - tag
  - tagcloud
  - recent_posts

# 小部件行为
category_limits: 10
tag_limits: 10
recent_posts_limits: 5
tagcloud_limits: 20

# 归档行为
only_show_capsule_in_index: false # 标签/分类很多时可设为 true，仅在首页显示胶囊标签以提升性能
uppercase_capsule: true # 想保持分类/标签胶囊原样显示请设为 false

show_update_time: false # 是否显示文章更新时间

# 摘要内容
summary:
  enable: false
  style: 'subtitle' # 'subtitle' 或 'blockquote'

# RSS 输出
rss:
  limit: 10             # 输出的最近文章数量，填 -1 表示输出全部
  showFullContent: false # 输出全文还是摘要
  showCopyright: false   # 为 true 时在文章末尾附加版权信息

# 排序方式配置
# 可选值：default、date、date-reverse、weight、weight-reverse
# default：Hugo 对页面集合的默认排序，见 https://gohugo.io/quick-reference/page-collections/#sort
# date：按日期升序（最早的在前面）
# date-reverse：按日期降序（最新的在前面）
# weight：按权重升序
# weight-reverse：按权重降序
sort_order:
  taxonomy:
    category: date-reverse # 受 categories_weight 参数控制
    tag: date-reverse # 受 tags_weight 参数控制
  archive: date-reverse # 受 weight 参数控制
  home: default # 受 weight 参数控制

# 分页
paginate:
  archive: # 归档页和分类/标签页每页的文章数
  post: # 首页及其他列表页每页的文章数

########################################
# CSS 样式
########################################

layout:
  max_width: 1350px # 主内容区最大宽度

triangle_badge:
  enable: false
  icon: github # 与 social 配置中的图标相同
  link: https://github.com/D-Sketon/hugo-theme-reimu

anchor_icon: # 默认使用 '#' 图标，也可以填 fontawesome 或 icon_font 的十六进制编码（如 'f0c1'），设为 false 可隐藏锚点图标

reimu_cursor:
  enable: true
  cursor:
    default: ../images/cursor/reimu-cursor-default.png  # 此路径相对于 css/main.css，需要用 ../ 回到 images 目录
    pointer: ../images/cursor/reimu-cursor-pointer.png
    text: ../images/cursor/reimu-cursor-text.png

icon_font: 4552607_ex15nbittbh

# 字体加载顺序
# 自定义字体 -> Google 字体 -> 本地回退字体

# 自定义字体
custom_font:
  enable: false
  article:
    # - css: https://fontsapi.zeoseven.com/292/main/result.css # 字体 CSS
    #   name: LXGW WenKai # 字体名称
  code:

# https://fonts.google.com/
# Google 字体，优先级高于 local_font
font:
  enable: true
  article:
    - Mulish
    - Noto Serif SC
  code:
    # - Ubuntu Mono
    # - Source Code Pro
    # - JetBrains Mono

# 本地回退字体
local_font:
  article:
    - "-apple-system"
    - PingFang SC
    - Microsoft YaHei
    - sans-serif
  code:
    - Menlo
    - Monaco
    - Consolas
    - monospace

dark_mode:
  # true 表示显示深色模式切换按钮
  # false 表示隐藏深色模式切换按钮
  button: true # true | false
  # true 表示默认开启深色模式
  # false 表示默认关闭深色模式
  # auto 表示跟随系统设置自动切换
  type: auto # true | false | auto

########################################
# 访问统计
########################################

baidu_analytics: false
google_analytics: false
clarity: false

########################################
# Markdown 显示
########################################

# mermaid 地址 https://github.com/mermaid-js/mermaid
mermaid:
  zoom: false # 是否为 mermaid 图表启用缩放

code_block:
  # 代码块默认是否展开
  # true 表示默认展开所有代码块
  # false 表示默认折叠所有代码块
  # 填数字表示代码行数超过该值时默认折叠
  expand: true

# 复制配置
clipboard:
  success: 
    en: Copy successfully (*^▽^*)
    zh-CN: 复制成功 (*^▽^*)
    zh-TW: 複製成功 (*^▽^*)
    ja: コピー成功 (*^▽^*)
    pt-BR: Copiado com sucesso (*^▽^*)
  fail: 
    en: Copy failed (ﾟ⊿ﾟ)ﾂ
    zh-CN: 复制失败 (ﾟ⊿ﾟ)ﾂ
    zh-TW: 複製失敗 (ﾟ⊿ﾟ)ﾂ
    ja: コピー失敗 (ﾟ⊿ﾟ)ﾂ
    pt-BR: Falha ao copiar (ﾟ⊿ﾟ)ﾂ
  copyright:
    enable: false
    count: 50 # 显示版权信息时的字符数
    license_type: by-nc-sa # 许可证类型，见 https://creativecommons.org/licenses

math:
  katex:
    enable: true
  mathjax:
    enable: false
    options: # 参见 https://docs.mathjax.org/en/latest/web/configuration.html
    # 配置必须放在数组里，因为 Hugo 会自动把 key 转成小写
      [
        {
          tex:
            {
              tags: "ams",
              useLabelIds: true,
              inlineMath: [["$", "$"], ['\\(', '\\)']],
              displayMath: [["$$", "$$"], ['\\[', '\\]']],
              processEscapes: true,
              processEnvironments: true,
              autoload: { color: [], colorv2: ["color"] },
              packages: { "[+]": ["noerrors"] },
            },
          options:
            {
              skipHtmlTags:
                ["script", "noscript", "style", "textarea", "pre", "code"],
              ignoreHtmlClass: "tex2jax_ignore",
              processHtmlClass: "tex2jax_process",
            },
          loader: { load: ["input/asciimath", "[tex]/noerrors"] },
        },
      ]

# 段落锚点
# 在正文的段落和列表项中注入可链接的锚点图标
# 用法：在 Markdown 中写 {#anchor-xxx}，对应元素会获得 id="anchor-xxx" 和锚点图标
anchor:
  # 显式锚点
  explicit:
    # 是否启用显式锚点：解析 Markdown 中的 {#anchor-xxx} 语法（默认 false）
    enable: false
    # 锚点标记：用于匹配显式锚点（除非与文章内容冲突，否则无需修改）
    marker: "{#anchor-"
    # 锚点 id 前缀：生成的 id = 前缀 + 标记里的 xxx 部分（默认 "anchor-"）
    prefix: "anchor-"
  # 自动锚点
  auto:
    # 是否启用自动锚点：根据文本内容为直接子段落自动生成 id（默认 false）
    enable: false
    # 自动生成锚点 id 的最大长度，超出会被截断（仅 auto.enable = true 时生效）
    length: 60

########################################
# 评论系统
########################################

# 评论系统的全局开关
# 可以同时启用多个评论系统
# 加载顺序：localStorage（用户手动选择）-> default
# -> valine -> waline -> twikoo -> gitalk -> giscus -> utterances -> beaudar -> disqus
comment:
  # 评论系统标题
  title:
    en: Leave a comment
    zh-CN: 说些什么吧！
    zh-TW: 說些什麼吧！
    ja: コメントを残す
    pt-BR: Deixe um comentário
  default: waline # 默认评论系统（启用多个评论系统时生效）

# valine 评论系统，https://valine.js.org
# 版本 1.5.1
# notify 和 verify 已废弃
valine:
  enable: false # 要使用 valine 请设为 true
  appId: # LeanCloud 应用的 App ID
  appKey: # LeanCloud 应用的 App Key
  pageSize: 10 # 评论列表每页数量
  avatar: mp # 头像风格，见 https://valine.js.org/#/avatar
  # lang: zh-cn # 已废弃，请改用 html.lang
  placeholder: Just go go # 评论框占位提示文字（例如：Please leave your footprints）
  guest_info: nick,mail,link # 评论者信息字段
  recordIP: true # 是否记录评论者 IP 地址
  highlight: true # 是否高亮代码块
  visitor: false # 是否显示访问量
  serverURLs: # LeanCloud 服务器地址

# https://waline.js.org/
waline:
  enable: false
  serverURL:
  # lang: zh-CN # 已废弃，请改用 html.lang
  locale: {} # 自定义语言，见 https://waline.js.org/guide/features/i18n.html#%E8%87%AA%E5%AE%9A%E4%B9%89%E8%AF%AD%E8%A8%80
  emoji:
    - https://unpkg.com/@waline/emojis@1.2.0/weibo
    - https://unpkg.com/@waline/emojis@1.2.0/alus
    - https://unpkg.com/@waline/emojis@1.2.0/bilibili
    - https://unpkg.com/@waline/emojis@1.2.0/qq
    - https://unpkg.com/@waline/emojis@1.2.0/tieba
    - https://unpkg.com/@waline/emojis@1.2.0/tw-emoji
  meta:
    - nick
    - mail
    - link
  requiredMeta:
    - nick
    - mail
  wordLimit: 0
  pageSize: 10
  pageview: true

# https://twikoo.js.org
twikoo:
  enable: false
  envId: # 腾讯云环境填 envId；Vercel 环境填地址（https://xxx.vercel.app）
  region:

# https://github.com/gitalk/gitalk/blob/master/readme-cn.md
gitalk:
  enable: false
  clientID:
  clientSecret:
  repo:
  owner:
  admin:
  md5: false

# https://giscus.app/zh-CN
giscus:
  enable: false
  repo:
  repoId:
  category:
  categoryId:
  mapping: mapping
  strict: 0
  reactionsEnabled: 1
  emitMetadata: 0
  inputPosition: bottom
  theme:
    light:
    dark:

# https://disqus.com
disqus:
  enable: false
  shortname: # 你的 disqus shortname
  count: true

# https://utteranc.es
utterances:
  enable: false
  repo: owner/repo # 改成 "你的 GitHub 用户名/仓库名"，用于存放博客评论
  issue_term: title
  theme: auto # auto 表示自动适配明暗主题，也可指定 github-light、github-dark、preferred-color-scheme 等具体主题

# https://beaudar.lipk.org/
beaudar:
  enable: false
  repo: owner/repo # 改成 "你的 GitHub 用户名/仓库名"，用于存放博客评论
  branch: main # 分支名，默认为 main
  issue_term: title # 用于创建评论 issue 的匹配项，支持 pathname、url、title、og:title
  issue_number:
  theme: auto # auto 表示自动适配明暗主题，也可指定 github-light、github-dark、preferred-color-scheme 等具体主题
  label:
  input_position: top # top/bottom，评论框位置，默认 top
  comment_order: desc # asc/desc，评论排序，asc 最早在前，desc 最新在前，默认 desc
  keep_theme: # true/false，是否把主题设置保存到 sessionStorage，默认 true
  loading: # true/false，点击加载图标时是否跳转到官网，默认 true

########################################
# 搜索
########################################

algolia_search:
  enable: false
  appID:
  apiKey:
  indexName:
  hits:
    per_page: 10

########################################
# 动画
########################################

preloader:
  enable: true
  text: 
    zh-CN: Loading...
    zh-TW: Loading...
    en: Loading...
    ja: Loading...
    pt-BR: Carregando...
  icon: # 默认使用内联 SVG 以提升速度，也可以填图片 URL，如 '/images/taichi.png'
  rotate: true # 是否旋转图标

# 参见 https://github.com/D-Sketon/aos.js
animation:
  enable: true
  options:
    header:
      title: slide-up
      subTitle: slide-down
    home:
      post: fade-up
      widget: fade-up
      sidebar: fade-up
    article:
      whole: fade-up
      date: zoom-in
      category: zoom-in
      tag: zoom-in
      comment: zoom-in
      reading: zoom-in
      nav: fade-up
    archive:
      whole: fade-up
      tag: zoom-in
      category: zoom-in
      section: fade-up
      nav: fade-up

# 参见 https://github.com/D-Sketon/mouse-firework
firework:
  enable: true
  disable_on_mobile: false
  options:
    excludeElements: ["a", "button"]
    particles:
      - shape: circle
        move: ["emit"]
        easing: easeOutExpo
        colors: ["var(--red-1)", "var(--red-2)", "var(--red-3)", "var(--red-4)"]
        number: 20
        duration: [1200, 1800]
        shapeOptions:
          radius: [16, 32]
          alpha: [0.3, 0.5]
      - shape: circle
        move: ["diffuse"]
        easing: easeOutExpo
        colors: ["var(--red-0)"]
        number: 1
        duration: [1200, 1800]
        shapeOptions:
          radius: 20
          alpha: [0.2, 0.5]
          lineWidth: 6

